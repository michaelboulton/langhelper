name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For the ty hook, which runs `uv run`.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: uv-cache
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.uv-cache.outputs.dir }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      # For the dart format and flutter analyze hooks of web/app.
      - id: flutter-version
        run: echo "version=$(sed -n 's/^ARG FLUTTER_VERSION=//p' web/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  dart:
    needs: prek
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SDK of the image.
      - id: flutter-version
        working-directory: .
        run: echo "version=$(sed -n 's/^ARG FLUTTER_VERSION=//p' web/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # lib/api/models.g.dart must be the output of lib/api/models.dart.
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib
      - run: flutter test
      # The build of the image, for tests/test_browser_app.py.
      - run: flutter build web --wasm --no-web-resources-cdn --base-href /static/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-web
          path: web/app/build/web
          retention-days: 1

  tests:
    needs: [prek, dart]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tests need the accents.db and glosses.db files from git lfs, but
      # not the decks.
      - run: git lfs ls-files --long --include "web/tlhelper/languages/*/*.db" > lfs-db-ids
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('lfs-db-ids') }}
      - run: git lfs pull --include "web/tlhelper/languages/*/*.db"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: uv-cache
        run: echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.uv-cache.outputs.dir }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --all-packages --locked
      # The heavy Croatian models for test_real_models. The key follows the
      # resources_2.2.json of classla 2.2; change it when classla changes it.
      - id: classla
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .data/classla_resources
          key: classla-hr-2.2
      - if: steps.classla.outputs.cache-hit != 'true'
        run: >-
          uv run --no-sync python -c "import classla;
          [classla.download('hr', type=t, processors='tokenize,pos,lemma', dir='.data/classla_resources')
          for t in ('standard', 'nonstandard')]"
      - run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-web
          path: web/app/build/web
      - run: uv run --no-sync pytest
        working-directory: tts
      - run: uv run --no-sync pytest
        working-directory: web
      # STATIC_DIR swaps the page for the whole server, so the JS page tests
      # run without it.
      - run: uv run --no-sync pytest tests/test_browser_app.py
        working-directory: web
        env:
          STATIC_DIR: app/build/web
