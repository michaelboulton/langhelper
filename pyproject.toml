# The workspace root: no project of its own, one uv.lock for both members.
# See README.md.
[tool.uv.workspace]
members = ["web", "tts"]

# CPU-only torch for web/ (its [tool.uv.sources] selects this index). The
# default PyPI wheel pulls several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# classla 2.2.3 pins protobuf==4.21.2 and torch<=2.6, which have security
# advisories. Remove these when classla allows the fixed versions.
[tool.uv]
override-dependencies = ["protobuf>=6.33.5", "torch>=2.8.0"]

# The override above needs its own copy of the CPU source of web/pyproject.toml.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

# accent_for returns None for an unknown word, and these tests subscript the
# result for a known one.
[[tool.ty.overrides]]
include = ["web/tests/languages/test_croatian_accents.py"]
rules = { not-subscriptable = "ignore" }

[dependency-groups]
dev = [
    "ty>=0.0.91",
    "ruff"
]
