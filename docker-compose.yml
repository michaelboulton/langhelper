# Local run of the image with the models that are already in ./.data, so the
# container does not download them again:
#   podman-compose up --build --force-recreate
# Without --force-recreate, podman-compose starts the old container again, and
# that container still uses the image from before the build.
# Then open http://localhost:8000/
services:
  classla:
    build: .
    ports:
      - "8000:8000"
    environment:
      # The app reads and writes classla_resources/ and lemmas.db under this path.
      DATA_ROOT: /data
      # The page, its script and its style sheet (static/ in this folder).
      STATIC_DIR: /app/static
      # Never download. If the models are not in ./.data, classify returns 503.
      DOWNLOAD_MODELS: "0"
      # The page ticks "Large models" until the user makes a choice.
      TLHELPER_ALWAYS_LARGE: "1"
      # The "explain with AI" buttons (tlhelper/explain/__init__.py) ask the
      # llamacpp service below. The network has no DNS, so the address is the
      # fixed address of llamacpp on that network (see networks at the end).
      # llama.cpp wants no key, but with no key the page has no buttons, so the
      # key is any text. The model is the --alias of llamacpp.
      TLHELPER_AI_API_BASE: http://10.89.231.10:9931/v1
      TLHELPER_AI_API_KEY: local
      TLHELPER_AI_MODEL: gemma-4-12b
      # For a paid service, use these lines and the tlhelper_ai_api_key secret
      # below, and remove the three lines above:
      # TLHELPER_AI_MODEL: gpt-5-mini
      # TLHELPER_AI_API_BASE: https://openrouter.ai/api/v1
      # The "Listen" buttons (tlhelper/speech/__init__.py) ask the voice
      # service below, at its fixed address on the network.
      TLHELPER_VOICE_URL: http://10.89.231.11:8002
    # For "Translate to English". entrypoint.sh reads the key from
    # /run/secrets/deepl_api_key. If you have no key, remove this block and the
    # secrets block at the end. The page then shows the reason in place of the
    # translation.
    secrets:
      - deepl_api_key
      # - tlhelper_ai_api_key
    volumes:
      - ./.data:/data
    # The image runs as uid 1000. With rootless podman, this maps that uid to
    # your own user, so the container can write to ./.data. Remove this line to
    # run with Docker, which does not know keep-id.
    userns_mode: keep-id

    # The image has no curl. The app writes no access line for /healthz.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 2m

    logging:
      driver: passthrough-tty

  llamacpp:
    # The server only, with the Vulkan backend (no CUDA). All its arguments:
    #   podman run --rm ghcr.io/ggml-org/llama.cpp:server-vulkan --help
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp
    restart: unless-stopped
    # The classla service calls this address (TLHELPER_AI_API_BASE above).
    networks:
      default:
        ipv4_address: 10.89.231.10
    # The web page of llama.cpp is at http://localhost:9931/. The port is open
    # on each interface of the host, and the server asks for no key.
    ports:
      - "9931:9931"

    # uid 0 in the container maps to `michael` on the host under rootless
    # podman, and the logind ACL on /dev/dri/{card1,renderD128} grants michael
    # rw — so this is what gets RADV a device. Same trick as the jellyfin
    # container in the notes, without needing the subgid entries.
    user: "0:0"
    devices:
      - /dev/dri:/dev/dri

    # `~` is not expanded here (no shell), so the model path is spelled out.
    command:
      - --model
      - /root/.cache/huggingface/hub/models--google--gemma-4-12B-it-qat-q4_0-gguf/snapshots/29d097773436b69ff9feafd636ab4cf873786537/gemma-4-12b-it-qat-q4_0.gguf
      # The audio and image encoder of the model. Without it the server
      # refuses audio and images. One download, from the same repo:
      #   hf download google/gemma-4-12B-it-qat-q4_0-gguf mmproj-gemma-4-12b-it-qat-q4_0.gguf
      - --mmproj
      - /root/.cache/huggingface/hub/models--google--gemma-4-12B-it-qat-q4_0-gguf/snapshots/29d097773436b69ff9feafd636ab4cf873786537/mmproj-gemma-4-12b-it-qat-q4_0.gguf
      # The name of the model in the API (TLHELPER_AI_MODEL above).
      - --alias
      - gemma-4-12b
      # The chat template of the model, with no thinking: an answer has 120
      # words at most, and the thinking uses the same 500 tokens.
      - --jinja
      - --reasoning
      - "off"
      # The image has only the Vulkan backend, so no argument selects it.
      - --host
      - 0.0.0.0
      # 9931 becomes the default of llama-server in a later release (now 8080).
      - --port
      - "9931"
      - --ctx-size
      - "32768"
      - --flash-attn
      - "on"
      - --gpu-layers
      - all

    logging:
      driver: passthrough-tty
    volumes:
      # Mount the whole hub dir, not just the snapshot: the .gguf in there is a
      # symlink into ../../blobs and would dangle otherwise.
      - type: bind
        source: ${HOME}/.cache/huggingface/hub
        target: /root/.cache/huggingface/hub
        read_only: true

    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9931"
      interval: 1s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5m

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Text to speech for the "Listen" buttons: ../omnivoice/README.md. On the
  # GPU through Vulkan, like llamacpp above. The first start downloads the
  # two GGUFs (945 MB) into the Hugging Face cache of the host (the bind
  # mount below). Each start then loads them in a few seconds.
  voice:
    build: ../omnivoice
    container_name: omnivoice
    restart: unless-stopped
    # The classla service calls this address (TLHELPER_VOICE_URL above).
    networks:
      default:
        ipv4_address: 10.89.231.11
    # For a curl from the host: http://localhost:8002/v1/models
    ports:
      - "8002:8002"
    environment:
      # Only the languages of the page. The model knows 600 more.
      OMNIVOICE_LANGUAGES: hr,de,fr,it,en
    # The image runs as uid 1000, and keep-id maps that to your own user, so
    # the container can write the GGUFs of the model into your cache, and
    # the logind ACL on /dev/dri (see llamacpp) lets it open the GPU.
    userns_mode: keep-id
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - type: bind
        source: ${HOME}/.cache/huggingface
        target: /hf

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5m

    logging:
      driver: passthrough-tty

# podman normally runs its own DNS server (aardvark-dns) on a compose network,
# so that services find each other by name. With rootless podman and a local
# resolver on the host (nameserver 127.0.0.1), that server resolves nothing.
# So turn it off. Each container then gets the resolvers of the host, and
# classla calls llamacpp at a fixed address in a fixed subnet. Docker ignores
# this key. The port that llamacpp publishes on the host is no use for this:
# from classla, host.containers.internal:9931 gets no answer, and the request
# waits until the AI timeout.
# An old network keeps its old setting: podman network rm classla_default
networks:
  default:
    x-podman.disable_dns: true
    ipam:
      config:
        - subnet: 10.89.231.0/24

# Create it one time:  printf '%s' "$KEY" | podman secret create deepl_api_key -
# Docker only has external secrets in swarm mode. For Docker Compose, replace
# "external: true" with "environment: DEEPL_API_KEY" and set that variable.
secrets:
  deepl_api_key:
    external: true
  # A secret that does not exist stops the start, so this one is a comment:
  #   printf '%s' "$KEY" | podman secret create tlhelper_ai_api_key -
  # tlhelper_ai_api_key:
  #   external: true
