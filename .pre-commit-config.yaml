# Run with prek (https://github.com/j178/prek): `prek install`, then `prek run --all-files`
default_stages:
  - pre-commit
  - manual

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # ty resolves the imports from .venv, so it needs every package and group.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --all-packages --all-groups --locked ty check
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
